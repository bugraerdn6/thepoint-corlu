<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Point | QR Kodları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14100d; --gold: #c8a15b; --gold-bright: #e3bd74;
    --cream: #f3ead9; --muted: #a89985; --line: #35291f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--cream);
    font-family: 'Jost', sans-serif; font-weight: 300;
    padding: 3rem 1.5rem 5rem;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    text-align: center; font-size: 2.6rem; color: var(--gold-bright);
    letter-spacing: 0.1em;
  }
  .sub { text-align: center; color: var(--muted); margin-top: 0.5rem; margin-bottom: 3rem; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 2rem;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: #1f1915;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.75rem;
    text-align: center;
  }
  .card img {
    width: 100%;
    max-width: 260px;
    border-radius: 8px;
    background: #fff;
    padding: 12px;
  }
  .card h2 {
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold); font-size: 1.4rem;
    margin-top: 1.25rem;
  }
  .card p { color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; word-break: break-all; }
  .card a.dl {
    display: inline-block; margin-top: 1rem;
    border: 1px solid var(--gold); border-radius: 999px;
    padding: 0.5rem 1.2rem; font-size: 0.8rem;
    color: var(--cream); text-decoration: none;
  }
  @media print {
    body { background: #fff; color: #000; }
    .card { border: 1px solid #ccc; break-inside: avoid; }
    .card a.dl { display: none; }
    h1, .card h2 { color: #000; }
    .sub, .card p { color: #555; }
  }
</style>
</head>
<body>
  <h1>THE POINT — QR Kodları</h1>
  <p class="sub">Masalara / girişe basmak için — tarayıcıdan sağ tık &gt; "Yazdır" ile çıktı alabilirsin.</p>

  <div class="cards">
    <div class="card">
      <img src="qr/menu.png" alt="Menü QR kodu">
      <h2>Menü</h2>
      <p>bugraerdn6.github.io/thepoint-corlu</p>
      <a class="dl" href="qr/menu.png" download>PNG indir</a>
    </div>
    <div class="card">
      <img src="qr/instagram.png" alt="Instagram QR kodu">
      <h2>Instagram</h2>
      <p>instagram.com/thepoint.corlu</p>
      <a class="dl" href="qr/instagram.png" download>PNG indir</a>
    </div>
    <div class="card">
      <img src="qr/google-yorum.png" alt="Google yorum QR kodu">
      <h2>Google'da Yorum Yap</h2>
      <p>share.google/JkHGgK2PrpbeEOBc0</p>
      <a class="dl" href="qr/google-yorum.png" download>PNG indir</a>
    </div>
  </div>
</body>
</html>
